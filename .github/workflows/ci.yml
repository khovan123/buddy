name: CI/CD

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
  workflow_dispatch:

env:
  AZURE_REGISTRY: ${{ secrets.AZURE_REGISTRY_URL }}

# ────────────────────────────────────────────────────────────────────────────────
# Stage 1: Detect which services/webapp have code changes.
# Outputs a dynamic JSON matrix so downstream jobs only run for changed targets.
# ────────────────────────────────────────────────────────────────────────────────
jobs:
  detect:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      has_service_changes: ${{ steps.set-matrix.outputs.has_service_changes }}
      has_webapp_changes:  ${{ steps.set-webapp.outputs.has_webapp_changes }}
      services_matrix:    ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4

      - name: Path filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            libs:
              - 'libs/**'
            lockfile:
              - 'package-lock.json'
            rootpkg:
              - 'package.json'
            webapp:
              - 'webapp/**'
            api-gateway:
              - 'services/api-gateway/**'
            auth-service:
              - 'services/auth-service/**'
            user-service:
              - 'services/user-service/**'
            notification-service:
              - 'services/notification-service/**'
            content-service:
              - 'services/content-service/**'
            upload-service:
              - 'services/upload-service/**'
            billing-service:
              - 'services/billing-service/**'
            content-access-service:
              - 'services/content-access-service/**'
            interaction-service:
              - 'services/interaction-service/**'
            recommendation-service:
              - 'services/recommendation-service/**'
            rag-service:
              - 'services/rag-service/**'

      - name: Detect webapp changes
        id: set-webapp
        run: |
          SHARED="${{ steps.filter.outputs.libs == 'true' || steps.filter.outputs.lockfile == 'true' || steps.filter.outputs.rootpkg == 'true' }}"
          FORCE="${{ github.event_name == 'workflow_dispatch' }}"
          WEBAPP="${{ steps.filter.outputs.webapp }}"

          if [[ "$FORCE" == "true" || "$WEBAPP" == "true" || "$SHARED" == "true" ]]; then
            echo "has_webapp_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_webapp_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build dynamic matrix
        id: set-matrix
        run: |
          SERVICES=()
          SHARED="${{ steps.filter.outputs.libs == 'true' || steps.filter.outputs.lockfile == 'true' || steps.filter.outputs.rootpkg == 'true' }}"
          FORCE="${{ github.event_name == 'workflow_dispatch' }}"

          for SVC in api-gateway auth-service user-service notification-service \
                     content-service upload-service billing-service \
                     content-access-service interaction-service \
                     recommendation-service rag-service; do
            # dorny/paths-filter outputs are named exactly as the filter keys,
            # but GHA expressions can't do dynamic property access.
            # Parse from the full outputs JSON instead.
            CHANGED=$(echo '${{ toJson(steps.filter.outputs) }}' | jq -r --arg key "$SVC" '.[$key]')

            if [[ "$FORCE" == "true" || "$CHANGED" == "true" || "$SHARED" == "true" ]]; then
              SERVICES+=("\"$SVC\"")
            fi
          done

          if [[ ${#SERVICES[@]} -gt 0 ]]; then
            MATRIX="{\"service\":[$(IFS=,; echo "${SERVICES[*]}")]}"
            echo "has_service_changes=true" >> "$GITHUB_OUTPUT"
          else
            MATRIX='{"service":[]}'
            echo "has_service_changes=false" >> "$GITHUB_OUTPUT"
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "### Changed services matrix" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$MATRIX" | jq . >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ─── Stage 2: Lint & Test (backend services only) ───────────────────
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_service_changes == 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: test_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports: ['6379:6379']

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: admin123
          RABBITMQ_DEFAULT_VHOST: microservices
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.base.json

      - name: Unit tests
        run: npm run test:unit
        env:
          NODE_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ''
          RABBITMQ_URL: amqp://admin:admin123@localhost:5672/microservices
          JWT_ACCESS_SECRET: test-secret-32-chars-minimum-here
          JWT_REFRESH_SECRET: test-refresh-secret-32-chars-here

  # ─── Stage 2b: Webapp lint & type-check (deploy handled by Vercel) ──
  webapp:
    name: Webapp Lint
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_webapp_changes == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint webapp
        working-directory: webapp
        run: npm run lint

      - name: Type check webapp
        working-directory: webapp
        run: npx tsc --noEmit

  # ─── Stage 3: Build & Push Docker images (changed services only) ────
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [detect, test]
    environment: production
    if: |
      needs.detect.outputs.has_service_changes == 'true'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production')

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.services_matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AZURE_REGISTRY }}
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.AZURE_REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.AZURE_REGISTRY }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # ─── Stage 4: Deploy to Azure Container Apps (changed services only) ─
  deploy:
    name: Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [detect, build]
    environment: production
    if: |
      needs.detect.outputs.has_service_changes == 'true'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production')

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.services_matrix) }}

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name "buddy-${{ matrix.service }}" \
            --resource-group "buddy" \
            --image "${{ env.AZURE_REGISTRY }}/${{ matrix.service }}:${{ github.sha }}"
