  deploy:
    name: Deploy ${{ matrix.service }} to Cloud Run
    runs-on: ubuntu-latest
    needs: [detect, test]
    environment: production

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: cloud-run-deploy-${{ github.ref }}
      cancel-in-progress: false

    if: |
      needs.detect.outputs.has_service_changes == 'true'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production')

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.detect.outputs.services_matrix) }}

    env:
      PROJECT_ID: project-20fe2419-cbae-442e-aea
      REGION: asia-southeast1
      REPOSITORY: buddy
      SERVICE: ${{ matrix.service }}
      IMAGE: asia-southeast1-docker.pkg.dev/project-20fe2419-cbae-442e-aea/buddy/${{ matrix.service }}:${{ github.sha }}
      REDIS_HOST: ${{ secrets.REDIS_HOST }}
      REDIS_PORT: ${{ secrets.REDIS_PORT }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: |
          gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Verify service exists
        run: |
          echo "Deploying service: $SERVICE"
          test -f "services/$SERVICE/package.json"

      - name: Build Docker image
        run: |
          docker build \
            --progress=plain \
            --build-arg SERVICE_NAME=$SERVICE \
            -t $IMAGE \
            .

      - name: Push Docker image
        run: |
          docker push $IMAGE

      - name: Deploy api-gateway to Cloud Run
        if: matrix.service == 'api-gateway'
        run: |
          gcloud run deploy $SERVICE \
            --image $IMAGE \
            --project $PROJECT_ID \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 1 \
            --set-env-vars HOST=0.0.0.0,NODE_ENV=production,SERVICE_NAME=$SERVICE,LOG_LEVEL=info,ALLOWED_ORIGINS=*,OTEL_SDK_DISABLED=true,REDIS_HOST=$REDIS_HOST,REDIS_PORT=$REDIS_PORT,REDIS_PASSWORD=$REDIS_PASSWORD

      - name: Deploy internal service to Cloud Run
        if: matrix.service != 'api-gateway'
        run: |
          gcloud run deploy $SERVICE \
            --image $IMAGE \
            --project $PROJECT_ID \
            --region $REGION \
            --platform managed \
            --no-allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 1 \
            --set-env-vars HOST=0.0.0.0,NODE_ENV=production,SERVICE_NAME=$SERVICE,LOG_LEVEL=info,ALLOWED_ORIGINS=*,OTEL_SDK_DISABLED=true,REDIS_HOST=$REDIS_HOST,REDIS_PORT=$REDIS_PORT,REDIS_PASSWORD=$REDIS_PASSWORD