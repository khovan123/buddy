name: CI/CD

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy manually
        required: true
        default: all
        type: choice
        options:
          - all
          - api-gateway
          - auth-service
          - user-service
          - notification-service
          - content-service
          - upload-service
          - billing-service
          - content-access-service
          - interaction-service
          - recommendation-service
          - rag-service

# ────────────────────────────────────────────────────────────────────────────────
# Stage 1: Detect which services/webapp have code changes.
# Outputs a dynamic JSON matrix so downstream jobs only run for changed targets.
# ────────────────────────────────────────────────────────────────────────────────
jobs:
  detect:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      has_service_changes: ${{ steps.set-matrix.outputs.has_service_changes }}
      has_webapp_changes:  ${{ steps.set-webapp.outputs.has_webapp_changes }}
      services_matrix:    ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4

      - name: Path filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            libs:
              - 'libs/**'
            lockfile:
              - 'package-lock.json'
            rootpkg:
              - 'package.json'
            webapp:
              - 'webapp/**'
            api-gateway:
              - 'services/api-gateway/**'
            auth-service:
              - 'services/auth-service/**'
            user-service:
              - 'services/user-service/**'
            notification-service:
              - 'services/notification-service/**'
            content-service:
              - 'services/content-service/**'
            upload-service:
              - 'services/upload-service/**'
            billing-service:
              - 'services/billing-service/**'
            content-access-service:
              - 'services/content-access-service/**'
            interaction-service:
              - 'services/interaction-service/**'
            recommendation-service:
              - 'services/recommendation-service/**'
            rag-service:
              - 'services/rag-service/**'

      - name: Detect webapp changes
        id: set-webapp
        run: |
          SHARED="${{ steps.filter.outputs.libs == 'true' || steps.filter.outputs.lockfile == 'true' || steps.filter.outputs.rootpkg == 'true' }}"
          WEBAPP="${{ steps.filter.outputs.webapp }}"

          if [[ "$WEBAPP" == "true" || "$SHARED" == "true" ]]; then
            echo "has_webapp_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_webapp_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build dynamic matrix
        id: set-matrix
        run: |
          SERVICES=()
          ALL_SERVICES=(
            api-gateway
            auth-service
            user-service
            notification-service
            content-service
            upload-service
            billing-service
            content-access-service
            interaction-service
            recommendation-service
            rag-service
          )

          SHARED="${{ steps.filter.outputs.libs == 'true' || steps.filter.outputs.lockfile == 'true' || steps.filter.outputs.rootpkg == 'true' }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SELECTED="${{ inputs.service }}"

            if [[ "$SELECTED" == "all" ]]; then
              for SVC in "${ALL_SERVICES[@]}"; do
                SERVICES+=("\"$SVC\"")
              done
            else
              SERVICES+=("\"$SELECTED\"")
            fi
          else
            for SVC in "${ALL_SERVICES[@]}"; do
              # dorny/paths-filter outputs are named exactly as the filter keys,
              # but GHA expressions can't do dynamic property access.
              # Parse from the full outputs JSON instead.
              CHANGED=$(echo '${{ toJson(steps.filter.outputs) }}' | jq -r --arg key "$SVC" '.[$key]')

              if [[ "$CHANGED" == "true" || "$SHARED" == "true" ]]; then
                SERVICES+=("\"$SVC\"")
              fi
            done
          fi

          if [[ ${#SERVICES[@]} -gt 0 ]]; then
            MATRIX="{\"service\":[$(IFS=,; echo "${SERVICES[*]}")]}"
            echo "has_service_changes=true" >> "$GITHUB_OUTPUT"
          else
            MATRIX='{"service":[]}'
            echo "has_service_changes=false" >> "$GITHUB_OUTPUT"
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "### Changed services matrix" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$MATRIX" | jq . >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ─── Stage 2: Lint & Test (backend services only) ───────────────────
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_service_changes == 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: test_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports: ['6379:6379']

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: admin123
          RABBITMQ_DEFAULT_VHOST: microservices
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.base.json

      - name: Unit tests
        run: npx turbo run test:unit --filter='!webapp' -- --passWithNoTests
        env:
          NODE_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ''
          RABBITMQ_URL: amqp://admin:admin123@localhost:5672/microservices
          JWT_ACCESS_SECRET: test-secret-32-chars-minimum-here
          JWT_REFRESH_SECRET: test-refresh-secret-32-chars-here

  # ─── Stage 2b: Webapp lint & type-check (deploy handled by Vercel) ──
  webapp:
    name: Webapp Lint
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_webapp_changes == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint webapp
        working-directory: webapp
        run: npm run lint

      - name: Check micro-frontend boundaries
        working-directory: webapp
        run: npm run mfe:check

      - name: Type check webapp
        working-directory: webapp
        run: npx tsc --noEmit

      - name: Test webapp
        working-directory: webapp
        run: npm test

