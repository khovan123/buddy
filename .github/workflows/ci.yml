name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'libs/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'services/**'
      - 'libs/**'

env:
  AZURE_REGISTRY: ${{ secrets.AZURE_REGISTRY_URL }}

jobs:
  # ─── Lint & Test ──────────────────────────────────────────────────
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: test_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports: ['6379:6379']

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: admin123
          RABBITMQ_DEFAULT_VHOST: microservices
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.base.json

      - name: Unit tests
        run: npm run test:unit
        env:
          NODE_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ''
          RABBITMQ_URL: amqp://admin:admin123@localhost:5672/microservices
          JWT_ACCESS_SECRET: test-secret-32-chars-minimum-here
          JWT_REFRESH_SECRET: test-refresh-secret-32-chars-here

  # ─── Build & Push Docker images to ACR ────────────────────────────
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - notification-service
          - content-service
          - upload-service
          - billing-service
          - content-access-service
          - interaction-service
          - recommendation-service

    steps:
      - uses: actions/checkout@v4

      - name: Check for service changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            service:
              - 'services/${{ matrix.service }}/**'
              - 'libs/**'
              - 'package-lock.json'

      - name: Log in to Azure Container Registry
        if: steps.changes.outputs.service == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AZURE_REGISTRY }}
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Set up Docker Buildx
        if: steps.changes.outputs.service == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.changes.outputs.service == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.AZURE_REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.AZURE_REGISTRY }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy to Azure Container Apps ───────────────────────────────
  deploy:
    name: Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - notification-service
          - content-service
          - upload-service
          - billing-service
          - content-access-service
          - interaction-service
          - recommendation-service

    steps:
      - uses: actions/checkout@v4

      - name: Check for service changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            service:
              - 'services/${{ matrix.service }}/**'
              - 'libs/**'
              - 'package-lock.json'

      - name: Azure Login
        if: steps.changes.outputs.service == 'true'
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      - name: Deploy to Azure Container Apps
        if: steps.changes.outputs.service == 'true'
        run: |
          az containerapp update \
            --name "buddy-${{ matrix.service }}" \
            --resource-group "buddy" \
            --image "${{ env.AZURE_REGISTRY }}/${{ matrix.service }}:${{ github.sha }}"
