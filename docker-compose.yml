
# ────────────────────────────────────────────────────────────────────
# Production-like docker-compose for local testing.
# Uses .env.prod, NODE_ENV=production, and multi-stage Dockerfiles
# to mirror the real deployment and catch issues before CI/CD.
# ────────────────────────────────────────────────────────────────────

x-node-service-env: &node-env
  NODE_ENV: production
  SERVICE_VERSION: '1.0.0'
  OTEL_SDK_DISABLED: 'true'          # Disable OTEL locally (no Grafana Cloud creds)
  REDIS_PORT: '6379'
  REDIS_PASSWORD: '${REDIS_PASSWORD:-redis123}'

services:
  # ─── Message Broker ───────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ms_rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-admin123}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-microservices}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - ms_network

  # ─── Databases ────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: ms_mongodb
    command: ["sh", "-c", "exec mongod --quiet --bind_ip_all --logpath /dev/null"]
    ports:
      - '27018:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - ms_network

  postgres:
    image: postgres:16-alpine
    container_name: ms_postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_MULTIPLE_DATABASES: auth_db,billing_db,upload_db,content_access_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ms_network

  # ─── Redis ────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: ms_redis
    ports:
      - '6379:6379'
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ms_network

