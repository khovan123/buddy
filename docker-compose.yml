  # ─── Vector Database (RAG) ──────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: ms_qdrant
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ms_network

  # ─── Observability ────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: ms_prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - ms_network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: ms_grafana
    ports:
      - '3100:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - ms_network

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: ms_jaeger
    ports:
      - '16686:16686'
      - '4317:4317'
      - '4318:4318'
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
      COLLECTOR_ZIPKIN_HOST_PORT: ':9411'
    networks:
      - ms_network

volumes:
  rabbitmq_data:
  postgres_data:
  mongodb_data:
  redis_data:
  grafana_data:
  recommendation_artifacts:
  qdrant_data:

networks:
  ms_network:
    driver: bridge
