app = "buddy-notification-service"
primary_region = "sin"

[build]
  dockerfile = "../../services/notification-service/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  HOST = "::"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
