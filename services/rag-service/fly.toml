app = "buddy-rag-service"
primary_region = "sin"

[build]
  dockerfile = "../../services/rag-service/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  HOST = "0.0.0.0"
  RAG_BLOCKING_WORKERS = "2"
  RAG_STARTUP_WARMUP_ENABLED = "false"
  RAG_BOOTSTRAP_INDEX_ENABLED = "false"
  RAG_CONSUMER_ENABLED = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "2048mb"
  cpu_kind = "shared"
  cpus = 1
